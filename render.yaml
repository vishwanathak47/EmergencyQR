services:
  - type: web
    name: emergencyqr
    env: node
    buildCommand: |
      # Build client
      echo "Building client..."
      cd client
      npm install --production=false
      npm run build
      cd ..
      
      # Build server
      echo "Building server..."
      cd server
      npm install
      mkdir -p dist/client
      cp -r ../client/dist/* dist/client/
      ls -la dist/client
    startCommand: cd server && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://emergencyqr-jtlp.onrender.com
      - key: VITE_SERVER_URL
        value: https://emergencyqr-jtlp.onrender.com