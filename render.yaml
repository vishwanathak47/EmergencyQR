services:
  - type: web
    name: emergencyqr
    runtime: node
    plan: free
    buildCommand: |
      # Debug current location
      pwd
      ls -la
      
      # Install dependencies and build client
      echo "Building client..."
      cd client
      npm install
      VITE_SERVER_URL=https://emergencyqr-jtlp.onrender.com npm run build
      cd ..
      
      # Install server dependencies and copy client build
      echo "Setting up server..."
      cd server
      npm install
      
      # Ensure dist/client directory exists and is empty
      rm -rf dist/client
      mkdir -p dist/client
      
      # Copy client build files
      echo "Copying client files..."
      cp -r ../client/dist/* dist/client/
      
      # Verify the copy
      echo "Verifying client files..."
      ls -la dist/client
    startCommand: cd server && NODE_ENV=production node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://emergencyqr-jtlp.onrender.com
      - key: VITE_SERVER_URL
        value: https://emergencyqr-jtlp.onrender.com