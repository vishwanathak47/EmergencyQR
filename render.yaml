services:
  - type: web
    name: emergencyqr
    env: node
    rootDir: server
    buildCommand: |
      cd ../client && npm install && npm run build && cd ../server && npm install && mkdir -p dist/client && cp -r ../client/dist/* dist/client/
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://emergencyqr-jtlp.onrender.com